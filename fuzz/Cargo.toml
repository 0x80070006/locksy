# Cibles de fuzzing du noyau (cargo-fuzz, chaîne nightly).
# Paquet HORS du workspace racine : son propre `[workspace]` ci-dessous et son
# propre Cargo.lock. Lancer depuis ce dossier : `cargo +nightly fuzz run decrypt`.
[package]
name = "locksy-core-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
locksy-core = { path = "../crates/locksy-core" }

# Indispensable : sans lui, cargo croirait ce paquet membre du workspace racine.
[workspace]
members = ["."]

[[bin]]
name = "decrypt"
path = "fuzz_targets/decrypt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "open"
path = "fuzz_targets/open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "b64d"
path = "fuzz_targets/b64d.rs"
test = false
doc = false
bench = false

[[bin]]
name = "crockford_decode"
path = "fuzz_targets/crockford_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "totp_parse"
path = "fuzz_targets/totp_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_recovery_key"
path = "fuzz_targets/parse_recovery_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "percent_decode"
path = "fuzz_targets/percent_decode.rs"
test = false
doc = false
bench = false
