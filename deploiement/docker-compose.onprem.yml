# Locksy sur site : serveur Linux du domaine, HTTPS avec un certificat AD CS.
# Usage (depuis le dossier locksy/) :
#   docker compose -f deploiement/docker-compose.onprem.yml up -d --build
# Sauvegarde vérifiée (test de restauration, rotation, chiffrement age/gpg) :
#   sudo scripts/backup-locksy.sh --docker locksy-locksy-1 --dest /var/backups/locksy
# (nom du conteneur : docker compose -f deploiement/docker-compose.onprem.yml ps)
name: locksy

services:
  locksy:
    build: ..
    image: locksy:1.1.0
    restart: unless-stopped
    # Arrêt gracieux : délai de grâce (LOCKSY_SHUTDOWN_GRACE_SECS) + point de
    # contrôle de la base + vidage du journal syslog.
    stop_grace_period: 25s
    # Aucun port publié : seul le proxy HTTPS joint Locksy.
    expose:
      - "8743"
    volumes:
      - locksy-data:/data
    environment:
      LOCKSY_TRUST_PROXY: "true"
      # Réseau du proxy Caddy (seules ses connexions voient X-Forwarded-For lu) :
      # LOCKSY_TRUSTED_PROXIES: "172.16.0.0/12"
      # Jeton d'installation imposé (sinon : docker compose exec locksy cat /data/setup-token) :
      # LOCKSY_SETUP_TOKEN: "au-moins-20-caracteres-aleatoires"
      # Journal d'audit vers votre SIEM / collecteur syslog interne (facultatif) :
      # LOCKSY_SYSLOG: "udp://syslog.corp.local:514"
      # ... ou chiffré : "tcp+tls://syslog.corp.local:6514", AC interne montée en PEM :
      # LOCKSY_SYSLOG_CA_FILE: "/data/siem-ca.pem"
      # Charge et exploitation (voir docs/Installation-du-serveur.md) :
      # LOCKSY_ARGON2_CONCURRENCY: "2"
      # LOCKSY_ARGON2_QUEUE: "16"
      # LOCKSY_REQUEST_TIMEOUT_SECS: "120"
      # LOCKSY_HEADER_TIMEOUT_SECS: "15"
      # LOCKSY_LOG_FORMAT: "json"
      # LOCKSY_SHUTDOWN_GRACE_SECS: "10"
      # LOCKSY_DB_READERS: "4"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128

  proxy:
    # Image épinglée par empreinte (2.11.9-alpine) : une mise à jour est un
    # changement volontaire (nouveau tag et nouvelle empreinte).
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificat et clé émis par votre AD CS (voir le guide) :
      - ./certs:/certs:ro
      # Seuls emplacements inscriptibles (système de fichiers en lecture seule) :
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - locksy
    read_only: true
    tmpfs:
      - /tmp
    # Caddy reste root DANS le conteneur, avec la seule capacité
    # NET_BIND_SERVICE (ports 80 et 443). Avec no-new-privileges, la capacité
    # posée sur le binaire caddy ne s'appliquerait pas à un utilisateur non root :
    # ne pas ajouter de « user: » sans publier des ports > 1024.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 256

volumes:
  locksy-data:
  caddy-data:
  caddy-config:
