[package]
name = "locksy-desktop"
description = "Client de bureau Locksy pour Windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "locksy"
path = "src/main.rs"

[dependencies]
locksy-core = { path = "../locksy-core" }
eframe = "0.37"
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
dirs = "5"

# Propres à Windows : politique machine (registre HKLM) et dialogue « Enregistrer sous ».
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
rfd = { version = "0.15", default-features = false }

[build-dependencies]
winresource = "0.1"
