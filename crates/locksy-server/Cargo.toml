[package]
name = "locksy-server"
description = "Serveur Locksy : API, stockage chiffré et interface web"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
locksy-core = { path = "../locksy-core" }
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "limit"] }
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = "9"
url = "2"
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
