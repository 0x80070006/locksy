# Publication d'une version de Locksy, déclenchée par un tag vX.Y.Z.
#
# Ordre (contrat P4, à ne pas changer sans mettre à jour install.sh et la doc) :
#   1. le tag doit égaler la version du workspace (Cargo.toml) ;
#   2. SOURCE_DATE_EPOCH = date du dernier commit (compilation reproductible) ;
#   3. binaires par Dockerfile.release (serveur musl, wasm, client Windows) ;
#   4. signature Authenticode du client Windows (si WINDOWS_CERT_PFX existe) ;
#   5. SBOM CycloneDX (dist/sbom/) ;
#   6. assemblage par scripts/package-release.sh (dist/assets/, SHA256SUMS) ;
#   7. signature de SHA256SUMS : cosign sans clé (OIDC GitHub), toujours ;
#      minisign, si le secret MINISIGN_SECRET_KEY existe ;
#   8. attestation de provenance SLSA (actions/attest-build-provenance) ;
#   9. publication en BROUILLON : un humain relit puis publie.
#
# Vérification côté client (install.sh le fait automatiquement) :
#   cosign verify-blob --bundle SHA256SUMS.sigstore.json \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github\.com/<propriétaire>/<dépôt>/\.github/workflows/release\.yml@refs/tags/v' \
#     SHA256SUMS
#   minisign -Vm SHA256SUMS -P "<clé publique>"
#   gh attestation verify <fichier> --repo <propriétaire>/<dépôt>
#
# Secrets (facultatifs) : MINISIGN_SECRET_KEY, WINDOWS_CERT_PFX (base64),
# WINDOWS_CERT_PASSWORD. Variables : MINISIGN_PUBLIC_KEY, WINDOWS_TIMESTAMP_URL.
# Le nom de ce fichier (release.yml) fait partie de l'identité cosign vérifiée
# par install.sh : ne pas le renommer.
name: release

on:
  push:
    tags: ["v*"]

# Rien par défaut ; le job déclare exactement ce dont il a besoin.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write      # brouillon de release et téléversement des actifs
      id-token: write      # jeton OIDC : cosign sans clé et attestation
      attestations: write  # enregistrement de l'attestation de provenance
    env:
      # Les secrets ne sont pas lisibles dans un `if:` : on n'expose que leur
      # présence, sous forme de booléen.
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
      HAS_MINISIGN_KEY: ${{ secrets.MINISIGN_SECRET_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 1. Le tag doit égaler la version du workspace.
      - name: Tag = version du workspace
        run: |
          set -euo pipefail
          V=$(awk -F'"' '/^\[workspace\.package\]/{s=1; next} /^\[/{s=0} s && /^version *=/{print $2; exit}' Cargo.toml)
          [ -n "$V" ] || { echo "::error file=Cargo.toml::version du workspace introuvable"; exit 1; }
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag « $GITHUB_REF_NAME » invalide (attendu vX.Y.Z)"; exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$V" ]; then
            echo "::error::le tag $GITHUB_REF_NAME ne correspond pas à la version du workspace ($V)"; exit 1
          fi
          echo "Version $V"

      # 2. Horodatage de la source.
      - name: SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      # 3. Binaires.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Compilation (Dockerfile.release)
        run: |
          docker buildx build -f Dockerfile.release --target export \
            --build-arg SOURCE_DATE_EPOCH \
            --output type=local,dest=dist/release .
          ls -l dist/release
          sha256sum dist/release/*

      # 4. Authenticode (facultatif).
      - name: Signature Authenticode du client Windows
        if: env.HAS_WINDOWS_CERT == 'true'
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends osslsigncode
          umask 077
          D=$(mktemp -d "$RUNNER_TEMP/authenticode.XXXXXX")
          trap 'rm -rf "$D"' EXIT
          printf '%s' "$WINDOWS_CERT_PFX" | base64 -d > "$D/cert.pfx"
          printf '%s' "$WINDOWS_CERT_PASSWORD" > "$D/pass"
          # Horodatage RFC 3161 : la signature reste valide après expiration
          # du certificat.
          osslsigncode sign -pkcs12 "$D/cert.pfx" -readpass "$D/pass" \
            -h sha256 -n "Locksy" -i "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -ts "$TIMESTAMP_URL" \
            -in dist/release/locksy.exe -out "$D/locksy.exe"
          osslsigncode verify -in "$D/locksy.exe"
          mv "$D/locksy.exe" dist/release/locksy.exe
          sha256sum dist/release/locksy.exe

      # 5. SBOM CycloneDX, un par composant livré.
      - name: Toolchain Rust (rust-toolchain.toml)
        run: (rustup toolchain install || rustup show) && rustup show active-toolchain
      - name: SBOM CycloneDX
        run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --locked
          # Un inventaire par composant, pour SA cible de livraison (les
          # dépendances Windows du client de bureau y figurent, pas celles de
          # Linux). cargo-cyclonedx écrit crates/<crate>/<crate>.cdx.json pour
          # TOUT le workspace à chaque appel : on déplace le bon fichier
          # aussitôt. Horodatage et numéro de série changent à chaque
          # exécution (SHA256SUMS aussi, donc).
          mkdir -p dist/sbom
          for spec in "locksy-server x86_64-unknown-linux-musl" \
                      "locksy-desktop x86_64-pc-windows-gnu" \
                      "locksy-wasm wasm32-unknown-unknown"; do
            read -r c t <<< "$spec"
            cargo cyclonedx --format json --spec-version 1.5 --target "$t" -q
            f="crates/$c/$c.cdx.json"
            [ -f "$f" ] || { echo "::error::SBOM introuvable pour $c ($f)"; exit 1; }
            mv "$f" "dist/sbom/$c.cdx.json"
          done
          find crates -maxdepth 2 -name '*.cdx.json' -delete
          ls -l dist/sbom

      # 6. Assemblage des actifs et de SHA256SUMS.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Assemblage (scripts/package-release.sh)
        env:
          MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
        run: |
          bash scripts/package-release.sh "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
          (cd dist/assets && sha256sum -c SHA256SUMS)

      # 7. Signatures de SHA256SUMS.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Signature cosign sans clé (OIDC GitHub)
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle dist/assets/SHA256SUMS.sigstore.json \
            dist/assets/SHA256SUMS
          # Vérification immédiate avec l'identité qu'utilise install.sh.
          # Un nom de dépôt GitHub ne contient que [A-Za-z0-9._-] : seul le
          # point est à échapper dans l'expression régulière.
          REPO_RE=$(printf '%s' "$GITHUB_REPOSITORY" | sed 's/[.]/\\./g')
          cosign verify-blob \
            --bundle dist/assets/SHA256SUMS.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github\\.com/${REPO_RE}/\\.github/workflows/release\\.yml@refs/tags/v" \
            dist/assets/SHA256SUMS

      - name: Signature minisign
        if: env.HAS_MINISIGN_KEY == 'true'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
          umask 077
          K=$(mktemp "$RUNNER_TEMP/minisign.XXXXXX")
          trap 'rm -f "$K"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$K"
          # Clé générée par `minisign -G -W` : pas de mot de passe à saisir.
          minisign -Sm dist/assets/SHA256SUMS -s "$K" -t "Locksy $GITHUB_REF_NAME"
          if [ -n "$MINISIGN_PUBLIC_KEY" ]; then
            minisign -Vm dist/assets/SHA256SUMS -P "$MINISIGN_PUBLIC_KEY"
          else
            echo "::warning::variable MINISIGN_PUBLIC_KEY absente : install.sh ne pourra pas vérifier la signature minisign"
          fi

      # 8. Provenance : tous les actifs, sauf les fichiers de signature.
      - name: Liste des fichiers attestés
        id: subjects
        run: |
          set -euo pipefail
          {
            echo "paths<<LOCKSY_EOF"
            find dist/assets -maxdepth 1 -type f ! -name '*.sigstore.json' ! -name '*.minisig' | LC_ALL=C sort
            echo "LOCKSY_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.subjects.outputs.paths }}

      # 9. Brouillon de release.
      - name: Publication (brouillon)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l dist/assets
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Locksy $GITHUB_REF_NAME" \
            --notes "Voir CHANGELOG.md. Vérification : SHA256SUMS signé (cosign, et minisign si configuré), provenance : gh attestation verify <fichier> --repo $GITHUB_REPOSITORY" \
            dist/assets/*
